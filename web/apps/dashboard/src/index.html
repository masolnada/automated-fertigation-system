<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hort · Fertigation</title><script>/* Sets the substrate before first paint, so a dark-persisted operator never gets a white flash — the whole point of the mode being night legibility (web ADR-0013). Sole author of the initial value: the app reads it back rather than deciding again. prefers-color-scheme seeds only the first visit and is never consulted after that. */(function(){try{var s=localStorage.getItem("hort-theme");document.documentElement.dataset.theme=s==="dark"||s==="light"?s:matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){document.documentElement.dataset.theme="light"}})()</script></head><body><div id="root"></div><script type="module" src="./main.tsx"></script></body></html>
