# KinCony KC868-A8 — fertigation controller
# Board reference: https://devices.esphome.io/devices/kincony-kc868-a8/
#
# 8 relay outputs + 8 digital inputs via PCF8574 I2C expanders,
# S3/S4 onboard buttons, DS18B20 on 1-Wire.
# Relay 8: pump, relay 7: fertigation valve, relay 6: clean water valve.

esphome:
  name: kc868-a8
  friendly_name: Automated Fertigation System
  includes:
    - features/watering_log.h
    - features/schedules.h
    - features/watering_events.h
    - features/reset.h
    - features/watchdog.h
    - features/interlock.h
  on_boot:
    priority: -100
    then:
      - lambda: 'watering_log_init();'
      - lambda: 'schedules_init();'

esp32:
  board: esp32dev  # required by ESPHome; the A8 v1.x uses an ESP32-WROOM-32
  variant: esp32
  # ESP-IDF, not Arduino: with the Arduino framework the BT controller's
  # DRAM reservation overlaps another region and the boot asserts in
  # s_prepare_reserved_regions (hard boot loop, no safe mode). IDF is
  # also the future ESPHome default and builds a smaller binary.
  framework:
    type: esp-idf

# Pinned: audited/trusted code cannot change silently under a moving branch.
external_components:
  - source: github://Fabian-Schmidt/esphome-victron_ble@2024-12-27

# Victron SmartShunt battery monitor, read over BLE instant readout —
# passive listening, no pairing, no wiring to the board. MAC and AES
# key come from VictronConnect (Product info > Instant readout details).
esp32_ble_tracker:

victron_ble:
  - id: smartshunt
    mac_address: !secret smartshunt_mac
    bindkey: !secret smartshunt_bindkey

i2c:
  sda: 4
  scl: 5
  scan: true
  id: bus_a

# Wall-clock for watering-event timestamps. A DS3231 (ADR-0013) keeps time
# across field power-cycles with no network; SNTP corrects it and writes back
# whenever WiFi is available. The chip is a DS3231, but ESPHome has no native
# DS3231 driver, so it is driven by the `ds1307` platform: the DS3231's
# timekeeping registers (0x00-0x06 at 0x68) are byte-identical to the DS1307's.
# The DS3231's extras (temp-compensated oscillator, alarms, temperature) are unused.
# Pinned rather than inherited: ESPHome detects the timezone from the *build
# machine* when this is absent, so a build made anywhere else would silently
# shift every scheduled irrigation by an hour or more (ADR-0018). Schedules are
# local wall-clock, so this also gives them DST for free — 06:00 stays 06:00
# across the March and October changes.
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Madrid
    on_time_sync:
      - ds1307.write_time:
  - platform: ds1307
    id: rtc_time
    i2c_id: bus_a
    address: 0x68
    timezone: Europe/Madrid
    update_interval: 60min

wifi:
  # Tried in order: home IoT network first, phone hotspot as fallback so the
  # controller reconnects when taken out of home wifi range.
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_fallback_ssid
      password: !secret wifi_fallback_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: kc868-a8
    password: !secret ap_password

captive_portal:

web_server:
  port: 80
  version: 3
  include_internal: true
  auth:
    username: !secret web_server_user
    password: !secret web_server_password
  local: true

pcf8574:
  - id: "pcf8574_hub_out_1"
    address: 0x24
  - id: "pcf8574_hub_in_1"
    address: 0x22

switch:
  # After a power loss the pump and valves must come up OFF,
  # never restore a previous ON state.
  - platform: gpio
    name: "Pump"
    id: pump
    restore_mode: ALWAYS_OFF
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 7
      mode: OUTPUT
      inverted: true
    # The open-path invariant is enforced here too, not only when a valve closes
    # (ADR-0016): otherwise a start with nothing open would deadhead the pump for
    # the watchdog's whole ~18 s priming-plus-confirm window. Refusing before
    # watering_event_pump_on() also keeps junk zero-litre events out of the log.
    on_turn_on:
      - if:
          condition:
            lambda: 'return !pump_has_open_path();'
          then:
            - lambda: 'ESP_LOGW("pump", "refusing to run: no open path");'
            - switch.turn_off: pump
          else:
            - lambda: 'watchdog_arm(); watering_event_pump_on();'
    on_turn_off:
      - lambda: 'watering_event_pump_off();'
  # Sources (upstream). Exactly one is open at a time; which is which is fixed
  # here because the Flush and the recovery flush depend on knowing which one is
  # clean water. Closing one re-checks the pump's open path on both sides.
  - platform: gpio
    name: "Fertigation Valve"
    id: fertigation_valve
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: 'id(selected_source) = 2;'
    on_turn_off:
      - script.execute: stop_pump_without_path
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 6
      mode: OUTPUT
      inverted: true
  - platform: gpio
    name: "Clean Water Valve"
    id: clean_water_valve
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: 'id(selected_source) = 1;'
    on_turn_off:
      - script.execute: stop_pump_without_path
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 5
      mode: OUTPUT
      inverted: true
  # Third source: micro-organisms, kept separate from the humate so the two can
  # be dosed independently. The irrigation sequence does not open it yet.
  - platform: gpio
    name: "Microbiology Valve"
    id: microbiology_valve
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: 'id(selected_source) = 3;'
    on_turn_off:
      - script.execute: stop_pump_without_path
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 4
      mode: OUTPUT
      inverted: true
  # Output channels (downstream). Exactly one is open at a time, so the single
  # common-line flow sensor meters it unambiguously. Opening one records it as
  # the selected channel, which survives reboot so the offline manual button
  # knows where to send water. A channel is a numbered relay and nothing more —
  # which place it waters is a Zone, and Zones live on the server (web ADR-0014).
  - platform: gpio
    name: "Output 1"
    id: output_1
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: 'id(selected_output) = 1;'
    on_turn_off:
      - script.execute: stop_pump_without_path
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 0
      mode: OUTPUT
      inverted: true
  - platform: gpio
    name: "Output 2"
    id: output_2
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: 'id(selected_output) = 2;'
    on_turn_off:
      - script.execute: stop_pump_without_path
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 1
      mode: OUTPUT
      inverted: true
  - platform: gpio
    name: "Output 3"
    id: output_3
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: 'id(selected_output) = 3;'
    on_turn_off:
      - script.execute: stop_pump_without_path
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 2
      mode: OUTPUT
      inverted: true
  - platform: gpio
    name: "Output 4"
    id: output_4
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: 'id(selected_output) = 4;'
    on_turn_off:
      - script.execute: stop_pump_without_path
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 3
      mode: OUTPUT
      inverted: true

# Cycle settings, adjustable at runtime from the web UI, HA, or MQTT.
select:
  - platform: template
    name: "Cycle Mode"
    id: cycle_mode
    options:
      - Time
      - Volume
    initial_option: Time
    optimistic: true
    restore_value: true

number:
  - platform: template
    name: "Cycle Minutes"
    id: cycle_minutes
    min_value: 0
    max_value: 180
    step: 1
    initial_value: 25
    optimistic: true
    restore_value: true
    unit_of_measurement: min
    mode: box
  - platform: template
    name: "Cycle Liters"
    id: cycle_liters
    min_value: 0
    max_value: 500
    step: 0.5
    initial_value: 100
    optimistic: true
    restore_value: true
    unit_of_measurement: L
    mode: box
  - platform: template
    name: "Pre-wet Percent"
    id: prewet_percent
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 20
    optimistic: true
    restore_value: true
    unit_of_measurement: "%"
    mode: slider
  - platform: template
    name: "Min Flow"
    id: min_flow_lpm
    min_value: 0
    max_value: 10
    step: 0.1
    initial_value: 0.5
    optimistic: true
    restore_value: true
    unit_of_measurement: "L/min"
    mode: box
  # Minimum 1: the flush is what guarantees no residues, so it cannot
  # be zeroed.
  - platform: template
    name: "Flush Minutes"
    id: flush_minutes
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true
    unit_of_measurement: min
    mode: box
  # Flow-sensor calibration factor (pulses per litre). The YF-B5's nominal
  # K-factor is 396; this unit measured 387.0 (see docs/flow-sensor.md).
  # Adjust it against a measured volume without reflashing. Applied to both the
  # live rate and the total since reset.
  - platform: template
    name: "Pulses Per Liter"
    id: pulses_per_liter
    min_value: 100
    max_value: 2000
    step: 0.1
    initial_value: 387.0
    optimistic: true
    restore_value: true
    unit_of_measurement: "pulses/L"
    mode: box

globals:
  # Persisted cumulative water since the last reset, in liters. Survives normal reboots.
  - id: water_total_l
    type: double
    restore_value: yes
    initial_value: "0"
  # Last observed cumulative pulse count, to compute per-cycle deltas.
  - id: last_total_pulses
    type: double
    restore_value: no
    initial_value: "0"
  # Which phase the sequence is in: 0 idle, 1 pre-wet, 2 fertigation, 3 flush.
  # Written by the sequence (YAML), read by the watchdog (watchdog.h) — shared
  # across a YAML feature and a header feature, so it stays an ESPHome global.
  - id: current_phase
    type: int
    restore_value: no
    initial_value: "0"
  # water_total_l snapshot at the start of a volume phase, so the phase can
  # measure its own delta against the persisted cumulative counter.
  - id: phase_start_l
    type: double
    restore_value: no
    initial_value: "0"
  # Which output channel the sequence and the manual button water (0 = none).
  # Persisted so the button still knows where to send water with no wifi after a
  # reboot, and read by watering_events.h to stamp the channel on each event.
  - id: selected_output
    type: int
    restore_value: yes
    initial_value: "0"
  # Which source is in play: 0 none, 1 clean water, 2 fertigation, 3 microbiology.
  # Persisted for the same reason. The sequence overrides it per phase.
  - id: selected_source
    type: int
    restore_value: yes
    initial_value: "1"

  # The recipe of the run currently executing (ADR-0018). ESPHome's `delay` and
  # `wait_until` lambdas are separate callbacks that cannot see script
  # parameters, so the sequence copies its parameters here on entry. Not
  # persisted: a run does not survive a reboot, so neither should its recipe.
  # The recovery flush reads run_flush too, so it flushes for as long as the run
  # it is rescuing asked for rather than whatever the default happens to be.
  - id: run_volume
    type: bool
    restore_value: no
    initial_value: "false"
  - id: run_total
    type: float
    restore_value: no
    initial_value: "0"
  - id: run_prewet
    type: float
    restore_value: no
    initial_value: "0"
  - id: run_flush
    type: float
    restore_value: no
    initial_value: "5"
  # What to stamp on the next event the sequence opens: 0 sequence, 2 scheduled.
  # Set by the caller immediately before executing, because `trigger` is a
  # property of who asked rather than of the recipe (ADR-0018).
  - id: next_trigger_override
    type: int
    restore_value: no
    initial_value: "0"

  # RAM-only working scalars are file-scoped in their feature header, not globals
  # (ADR-0014): the watchdog's pump_on_since_ms / low_flow_secs in watchdog.h; the
  # watering-event event_* / next_trigger / pending_outcome / pump_handover in
  # watering_events.h; reset_persistence_ok is a local in reset_finalize().

script:
  # The pump must never run without an open path on BOTH sides (ADR-0016): one
  # open source upstream and one open output channel downstream. Closing the last
  # valve on either side stops it — whichever caller closed it: dashboard,
  # sequence, or the manual button. An open source with every output shut
  # deadheads the pump,
  # which drives it toward its 3.8 bar cutoff current against a 10 A BMS.
  # Guarded on the pump already running so the sequence's own valve closes
  # (pump already off) don't republish OFF each time.
  - id: stop_pump_without_path
    then:
      - if:
          condition:
            and:
              - switch.is_on: pump
              - lambda: 'return !pump_has_open_path();'
          then:
            - switch.turn_off: pump

  # Open exactly one output channel, closing the others first. Closing before
  # opening never leaves two open, which is what lets the single common-line flow
  # sensor meter unambiguously; a pump running manually on another channel loses
  # its path across the change and is stopped by the interlock, then restarted by
  # the caller — the same pause every source handover takes. Opening the channel
  # records it as the Selected Output, which survives reboot so the offline
  # manual button knows where to send water.
  - id: open_output_only
    parameters:
      channel: int
    then:
      - lambda: |-
          if (channel != 1) id(output_1).turn_off();
          if (channel != 2) id(output_2).turn_off();
          if (channel != 3) id(output_3).turn_off();
          if (channel != 4) id(output_4).turn_off();
          switch (channel) {
            case 1: id(output_1).turn_on(); break;
            case 2: id(output_2).turn_on(); break;
            case 3: id(output_3).turn_on(); break;
            case 4: id(output_4).turn_on(); break;
            default: ESP_LOGW("output", "no output channel selected; pump will stay off");
          }

  - id: close_all_outputs
    then:
      - switch.turn_off: output_1
      - switch.turn_off: output_2
      - switch.turn_off: output_3
      - switch.turn_off: output_4

  # The pump pauses across each valve handover — stop, swap the valve, start
  # again — so it never runs against closed valves, with its 3.8 bar pressure
  # switch as the backstop rather than the plan. Each valve is turned off
  # explicitly before the next is turned on, so the sequence opens only one at
  # a time on its own even though the interlock no longer enforces it.
  # The recipe travels with the run, exactly as the channel does (ADR-0018): the
  # whole instruction arrives as parameters, so a scheduled run cannot be changed
  # by someone adjusting the dashboard's numbers, and two schedule entries can
  # water differently. The `cycle_*` entities are now the *default* recipe — what
  # the offline button waters with — and are read only by the callers that have
  # no recipe of their own, never in here.
  #
  # Parameters are copied to globals on entry because ESPHome's `delay` and
  # `wait_until` lambdas are separate callbacks that cannot see script parameters.
  - id: irrigation_sequence
    mode: single
    parameters:
      channel: int
      volume: int
      total: float
      prewet: float
      flush: float
    then:
      - lambda: |-
          id(run_volume) = volume != 0;
          id(run_total) = total;
          id(run_prewet) = prewet;
          id(run_flush) = flush;
      - lambda: 'watering_set_next_trigger(id(next_trigger_override));'
      - lambda: 'id(next_trigger_override) = 0;'
      # One run waters exactly one output channel (ADR-0017), and the channel is
      # an input to the run rather than whatever happens to be open: it is opened
      # once up front and left open for the whole sequence, so no downstream
      # handover is needed. Callers validate the channel before executing.
      - script.execute:
          id: open_output_only
          channel: !lambda 'return channel;'
      - delay: 500ms
      # Phase 1: pre-wet with clean water — prime lines, moisten soil.
      - if:
          condition:
            lambda: 'return id(run_total) * id(run_prewet) / 100.0 > 0;'
          then:
            - lambda: 'id(current_phase) = 1;'
            - if:
                condition:
                  lambda: 'return id(run_volume);'
                then:
                  - lambda: 'id(phase_start_l) = id(water_total_l);'
            - switch.turn_on: clean_water_valve
            - delay: 2s
            - switch.turn_on: pump
            - if:
                condition:
                  lambda: 'return !id(run_volume);'
                then:
                  - delay: !lambda 'return (uint32_t)(id(run_total) * id(run_prewet) / 100.0 * 60000);'
                else:
                  - wait_until:
                      lambda: 'return id(water_total_l) - id(phase_start_l) >= id(run_total) * id(run_prewet) / 100.0;'
      # Phase 2: fertigation.
      - if:
          condition:
            lambda: 'return id(run_total) * (1.0 - id(run_prewet) / 100.0) > 0;'
          then:
            - lambda: 'id(current_phase) = 2;'
            - lambda: 'watering_set_handover(true);'
            - switch.turn_off: pump
            - delay: 2s
            - switch.turn_off: clean_water_valve
            - switch.turn_on: fertigation_valve
            - delay: 2s
            - if:
                condition:
                  lambda: 'return id(run_volume);'
                then:
                  - lambda: 'id(phase_start_l) = id(water_total_l);'
            - switch.turn_on: pump
            - lambda: 'watering_set_handover(false);'
            - if:
                condition:
                  lambda: 'return !id(run_volume);'
                then:
                  - delay: !lambda 'return (uint32_t)(id(run_total) * (1.0 - id(run_prewet) / 100.0) * 60000);'
                else:
                  - wait_until:
                      lambda: 'return id(water_total_l) - id(phase_start_l) >= id(run_total) * (1.0 - id(run_prewet) / 100.0);'
      # Phase 3: flush with clean water so no residues remain.
      - lambda: 'id(current_phase) = 3;'
      - lambda: 'watering_set_handover(true);'
      - switch.turn_off: pump
      - delay: 2s
      - switch.turn_off: fertigation_valve
      - switch.turn_on: clean_water_valve
      - delay: 2s
      - switch.turn_on: pump
      - lambda: 'watering_set_handover(false);'
      - delay: !lambda "return (uint32_t)(id(run_flush) * 60000);"
      # Shutdown
      - switch.turn_off: pump
      - lambda: 'id(current_phase) = 0;'
      - delay: 2s
      - switch.turn_off: clean_water_valve
      - script.execute: close_all_outputs

  # Watchdog recovery for an empty fertigation tank. This deliberately does
  # not use abort_irrigation: it preserves the required full safety flush.
  - id: recovery_flush
    mode: single
    then:
      - script.stop: irrigation_sequence
      - lambda: 'watering_set_handover(true);'
      - switch.turn_off: pump
      - delay: 2s
      - switch.turn_off: fertigation_valve
      - switch.turn_on: clean_water_valve
      - delay: 2s
      - lambda: 'id(current_phase) = 3;'
      - switch.turn_on: pump
      - lambda: 'watering_set_handover(false);'
      # The run's own flush, not the default: this is rescuing a specific run,
      # and shortening its flush would leave residue the run asked to clear.
      - delay: !lambda "return (uint32_t)(id(run_flush) * 60000);"
      - lambda: 'watering_set_pending_outcome(3);'
      - switch.turn_off: pump
      - lambda: 'id(current_phase) = 0;'
      - delay: 2s
      - switch.turn_off: clean_water_valve
      - script.execute: close_all_outputs

  # Single shared interrupt path: the stop button, the MQTT stop topic,
  # and any future sensor (tank float switch, pump current) all execute
  # this. Pump goes off first so it never runs against closed valves.
  - id: abort_irrigation
    mode: single
    then:
      - script.stop: irrigation_sequence
      - script.stop: recovery_flush
      - lambda: 'id(current_phase) = 0;'
      - switch.turn_off: pump
      - delay: 2s
      - switch.turn_off: fertigation_valve
      - switch.turn_off: clean_water_valve
      - switch.turn_off: microbiology_valve
      - script.execute: close_all_outputs

  # Manual start/stop from the onboard button, no wifi needed. Opens the
  # persisted source and output channel — not everything — so tanks cannot back-feed each
  # other and the held-valve current stays at one valve per side; pressing again
  # stops the pump first, then closes them.
  - id: manual_pump_toggle
    mode: single
    then:
      - if:
          condition:
            - switch.is_on: pump
          then:
            - switch.turn_off: pump
            - delay: 2s
            - switch.turn_off: clean_water_valve
            - switch.turn_off: fertigation_valve
            - switch.turn_off: microbiology_valve
            - script.execute: close_all_outputs
          else:
            - lambda: 'watering_set_next_trigger(1);'
            - lambda: |-
                switch (id(selected_source)) {
                  case 2: id(fertigation_valve).turn_on(); break;
                  case 3: id(microbiology_valve).turn_on(); break;
                  case 1: id(clean_water_valve).turn_on(); break;
                  default: ESP_LOGW("source", "no source selected; pump will stay off");
                }
            # The button waters the Selected Output — the last channel anyone
            # opened, sequence included — because standing at the box with no
            # network, what ran last is the only channel it can know about.
            - script.execute:
                id: open_output_only
                channel: !lambda 'return id(selected_output);'
            - delay: 2s
            - switch.turn_on: pump

  - id: dry_run_publish
    then:
      - mqtt.publish:
          topic: kc868-a8/flow/dry_run
          payload: "ON"

  - id: recovery_flush_publish
    then:
      - mqtt.publish:
          topic: kc868-a8/irrigation/recovery_flush
          payload: "ON"

  # Shared native-web/MQTT reset path. The short delay after assignment gives
  # the restoring global's component loop time to stage zero before sync.
  - id: reset_total_water
    mode: single
    then:
      - if:
          condition:
            lambda: 'return reset_prepare();'
          then:
            - delay: 1s
            - lambda: 'reset_finalize();'

button:
  - platform: template
    name: "Start Irrigation"
    id: start_irrigation
    on_press:
      # No channel and no recipe to carry, so this entity waters the Selected
      # Output with the *default* recipe — the `cycle_*` entities (ADR-0018).
      # That is what those entities are for now: a button has no payload, and
      # standing at the box with no network there is nothing else to read. A
      # start naming no channel is refused rather than run dry with the pump
      # interlocked off, which looked identical to nothing happening.
      - lambda: |-
          int channel = id(selected_output);
          if (channel < 1 || channel > 4) {
            ESP_LOGW("irrigation", "no output channel selected; refusing to start");
            return;
          }
          bool volume = id(cycle_mode).state == "Volume";
          id(irrigation_sequence)->execute(
            channel, volume ? 1 : 0,
            volume ? id(cycle_liters).state : id(cycle_minutes).state,
            id(prewet_percent).state, id(flush_minutes).state);
  - platform: template
    name: "Stop Irrigation"
    id: stop_irrigation
    on_press:
      - lambda: 'watering_set_pending_outcome(1);'
      - script.execute: abort_irrigation
  - platform: template
    name: "Reset Total Water"
    id: reset_total_water_button
    on_press:
      - script.execute: reset_total_water

binary_sensor:
  - platform: template
    name: "Irrigation Running"
    lambda: "return id(irrigation_sequence).is_running() || id(recovery_flush).is_running();"
  # Mirrors the SmartShunt's own charged detection (charged voltage
  # 14.0V, tail current 4% of 8Ah, 3 min): ON when the charge cycle
  # completes, OFF again once the MPPT drops to float.
  - platform: template
    name: "Battery Charged"
    id: battery_charged
    filters:
      - delayed_on: 180s
    lambda: |-
      if (isnan(id(batt_voltage).state) || isnan(id(batt_current).state))
        return {};
      return id(batt_voltage).state >= 14.0 &&
             fabs(id(batt_current).state) <= 0.32;
    on_press:
      - mqtt.publish:
          topic: kc868-a8/battery/charged
          payload: "ON"
  - platform: gpio
    name: "a8-input1"
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 0
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "a8-input2"
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 1
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "a8-input3"
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 2
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "a8-input4"
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 3
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "a8-input5"
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 4
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "a8-input6"
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 5
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "a8-input7"
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 6
      mode: INPUT
      inverted: true
  - platform: gpio
  # External button wired to input terminal D8 (opto-isolated dry contact):
  # manual irrigation start/stop at the board, independent of wifi/MQTT. Opens
  # both valves and starts the pump; pressing again stops the pump and closes
  # both valves.
    name: "Pump Button"
    id: pump_button
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 7
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: 50ms
    on_press:
      - script.execute: manual_pump_toggle
  - platform: gpio
    name: "a8-s3"
    pin:
      number: 32
      inverted: true
  - platform: gpio
    name: "a8-s4"
    pin:
      number: 33
      inverted: true

sensor:
  # The shunt broadcasts ~1/s; throttle publishing to every 5s.
  - platform: victron_ble
    victron_ble_id: smartshunt
    name: "Battery Voltage"
    id: batt_voltage
    type: BATTERY_VOLTAGE
    filters:
      - throttle_average: 5s
  - platform: victron_ble
    victron_ble_id: smartshunt
    name: "Battery Current"
    id: batt_current
    type: BATTERY_CURRENT
    filters:
      - throttle_average: 5s
  - platform: victron_ble
    victron_ble_id: smartshunt
    name: "Battery State of Charge"
    type: STATE_OF_CHARGE
    filters:
      - throttle: 5s
  - platform: victron_ble
    victron_ble_id: smartshunt
    name: "Battery Consumed Ah"
    type: CONSUMED_AH
    filters:
      - throttle: 5s
  - platform: victron_ble
    victron_ble_id: smartshunt
    name: "Battery Time Remaining"
    type: TIME_TO_GO
    filters:
      - throttle: 5s
  # Part of the reboot diagnosis: uptime resetting proves a reboot.
  - platform: uptime
    name: "Uptime"
    update_interval: 30s
  # YF-B5 flow sensor on GPIO14 (sensor header S1). 387.0 pulses per liter measured
  # (396 pulses per liter nominal).
  # Powered at 12V but its output is a stiff ~5V logic signal, dropped to ~3V
  # by a 2.2k series / 3.3k-to-GND divider; the sensor drives its own output,
  # so no internal pullup.
  - platform: pulse_counter
    pin:
      number: GPIO14
      mode:
        input: true
    id: flow_pulses
    name: "Flow Rate"
    unit_of_measurement: "L/min"
    accuracy_decimals: 2
    update_interval: 1s
    # pulse_counter reports pulses/min; 387.0 pulses = 1 L measured (396 nominal).
    filters:
      - lambda: |-
          float k = id(pulses_per_liter).state;
          return x / (k > 0 ? k : 387.0);
    total:
      id: flow_total_pulses
      internal: true
      # Accumulate the delta since the last update into the persisted total.
      on_value:
        - lambda: |-
            double delta = x - id(last_total_pulses);
            if (delta < 0) delta = x;      // counter reset (reboot) → treat x as delta
            id(last_total_pulses) = x;
            float k = id(pulses_per_liter).state;
            id(water_total_l) += delta / (k > 0 ? k : 387.0);

  # Persisted cumulative water since the last reset, exposed as its own sensor.
  - platform: template
    name: "Total Water"
    id: total_water
    unit_of_measurement: "L"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: return id(water_total_l);

interval:
  # Dry-run protection: with the pump running past its priming grace, sustained
  # low flow invokes a fertigation recovery flush or the shared abort path.
  - interval: 1s
    then:
      - lambda: 'watchdog_tick();'

  # The scheduler (ADR-0018). Fires from the RTC, so watering carries on through
  # the weeks this controller has no network. Every 20s rather than every minute
  # so a fire is not missed when a tick lands late; each entry records the minute
  # it fired in and will not fire twice within it.
  - interval: 20s
    then:
      - lambda: |-
          auto now = id(rtc_time).now();
          // No valid clock means no idea what day it is; watering blind is worse
          // than not watering. A fresh RTC has none until its first SNTP sync.
          if (!now.is_valid()) return;
          uint32_t day_number = (uint32_t) (now.timestamp / 86400);
          uint32_t minute_stamp = day_number * 1440 + now.hour * 60 + now.minute;
          for (uint8_t i = 0; i < g_schedules.count; i++) {
            ScheduleEntry &entry = g_schedules.entries[i];
            if (entry.hour != now.hour || entry.minute != now.minute) continue;
            if (g_schedule_last_fired[i] == minute_stamp) continue;
            if (!schedule_fires_on(entry, now.day_of_week, day_number)) continue;
            g_schedule_last_fired[i] = minute_stamp;
            // One channel at a time: the sequence is `mode: single`, so a second
            // start would be silently dropped. Recorded as a skipped run instead
            // — a zone that quietly went unwatered is a question the history has
            // to be able to answer (ADR-0018).
            if (id(irrigation_sequence).is_running() || id(recovery_flush).is_running() || id(pump).state) {
              ESP_LOGW("schedule", "entry %s due while already watering; skipped", entry.id);
              watering_record_skipped(entry.channel);
              continue;
            }
            ESP_LOGI("schedule", "entry %s firing on channel %u", entry.id, (unsigned) entry.channel);
            id(next_trigger_override) = 2;  // scheduled
            id(irrigation_sequence)->execute(entry.channel, entry.volume, entry.total,
                                             entry.prewet, entry.flush);
          }

logger:

# Diagnosing the reboot-on-relay-switch issue: reset_reason distinguishes
# a brownout (power path) from a firmware panic. Remove once resolved.
debug:
  update_interval: 30s

text_sensor:
  # Current wall-clock read from the I2C DS3231 at 0x68 through rtc_time.
  # SNTP may correct the RTC when online, but this entity never reads SNTP directly.
  - platform: template
    name: "RTC Time"
    id: rtc_time_display
    update_interval: 10s
    lambda: |-
      auto now = id(rtc_time).now();
      if (!now.is_valid())
        return {"Time unavailable"};
      return {now.strftime("%d-%m-%Y %H:%M:%S")};
  - platform: debug
    reset_reason:
      name: "Reset Reason"

# No API client ever connects (control is MQTT + web dashboard), so the
# API's own no-client watchdog must be off — its default reboots the
# device every 15 minutes. Same reason mqtt has reboot_timeout: 0s.
api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    id: my_ota
    password: !secret ota_password

mqtt:
  broker: !secret mqtt_broker_ip
  username: !secret mqtt_broker_username
  password: !secret mqtt_broker_password
  client_id: kc868-a8
  reboot_timeout: 0s
  # On (re)connect, refresh the broker's retained watering log with anything
  # accumulated while offline, so the server backfills on the next ingest.
  on_connect:
    - lambda: 'watering_log_publish_retained();'
  on_message:
    # The channel travels with the start (ADR-0017). Validated here, at the
    # boundary: a payload naming no channel is refused, never silently sent to
    # whichever valve was last left open.
    - topic: kc868-a8/irrigation/start
      then:
        - lambda: |-
            // The whole instruction arrives as JSON: channel plus recipe
            // (ADR-0018). Both are inputs to the run, so a payload missing
            // either is refused rather than filled in from device state — the
            // path this decision exists to remove.
            auto number = [&](const char *key, float fallback) -> float {
              char needle[16];
              snprintf(needle, sizeof(needle), "\"%s\":", key);
              const char *found = strstr(x.c_str(), needle);
              return found == nullptr ? fallback : (float) atof(found + strlen(needle));
            };
            int channel = (int) number("channel", 0);
            if (channel < 1 || channel > 4) {
              ESP_LOGW("irrigation", "start payload '%s' names no output channel; refusing", x.c_str());
              return;
            }
            float flush = number("flush", 0);
            if (flush < 1) {
              ESP_LOGW("irrigation", "start payload '%s' has no valid flush; refusing", x.c_str());
              return;
            }
            id(irrigation_sequence)->execute(channel, (int) number("volume", 0),
                                             number("total", 0), number("prewet", 0), flush);
    # The whole schedule set, retained by the broker so an edit made while this
    # controller was in the field lands the moment it reconnects (web ADR-0017).
    - topic: kc868-a8/schedule/set
      then:
        - lambda: |-
            int count = schedules_apply_json(x.c_str());
            if (count < 0) {
              ESP_LOGW("schedule", "malformed schedule payload; keeping the previous set");
              return;
            }
            ESP_LOGI("schedule", "stored %d schedule entries", count);
    - topic: kc868-a8/irrigation/stop
      then:
        - lambda: 'watering_set_pending_outcome(1);'
        - script.execute: abort_irrigation
    - topic: kc868-a8/flow/reset_total/request
      then:
        - script.execute: reset_total_water
