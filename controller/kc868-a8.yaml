# KinCony KC868-A8 — fertigation controller
# Board reference: https://devices.esphome.io/devices/kincony-kc868-a8/
#
# 8 relay outputs + 8 digital inputs via PCF8574 I2C expanders,
# S3/S4 onboard buttons, DS18B20 on 1-Wire.
# Relay 8: pump, relay 7: fertigation valve, relay 6: clean water valve.

esphome:
  name: kc868-a8
  friendly_name: Automated Fertigation System

esp32:
  board: esp32dev  # required by ESPHome; the A8 v1.x uses an ESP32-WROOM-32
  variant: esp32
  # ESP-IDF, not Arduino: with the Arduino framework the BT controller's
  # DRAM reservation overlaps another region and the boot asserts in
  # s_prepare_reserved_regions (hard boot loop, no safe mode). IDF is
  # also the future ESPHome default and builds a smaller binary.
  framework:
    type: esp-idf

# Pinned: audited/trusted code cannot change silently under a moving branch.
external_components:
  - source: github://Fabian-Schmidt/esphome-victron_ble@2024-12-27

# Victron SmartShunt battery monitor, read over BLE instant readout —
# passive listening, no pairing, no wiring to the board. MAC and AES
# key come from VictronConnect (Product info > Instant readout details).
esp32_ble_tracker:

victron_ble:
  - id: smartshunt
    mac_address: !secret smartshunt_mac
    bindkey: !secret smartshunt_bindkey

i2c:
  sda: 4
  scl: 5
  scan: true
  id: bus_a

wifi:
  # Tried in order: home IoT network first, phone hotspot as fallback so the
  # controller reconnects when taken out of home wifi range.
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_fallback_ssid
      password: !secret wifi_fallback_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: kc868-a8
    password: !secret ap_password

captive_portal:

web_server:
  port: 80
  version: 3
  include_internal: true
  auth:
    username: !secret web_server_user
    password: !secret web_server_password
  local: true

pcf8574:
  - id: "pcf8574_hub_out_1"
    address: 0x24
  - id: "pcf8574_hub_in_1"
    address: 0x22

switch:
  # After a power loss the pump and valves must come up OFF,
  # never restore a previous ON state.
  - platform: gpio
    name: "Pump"
    id: pump
    restore_mode: ALWAYS_OFF
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 7
      mode: OUTPUT
      inverted: true
    on_turn_on:
      - lambda: |-
          id(pump_on_since_ms) = millis();
          id(low_flow_secs) = 0;
  # Both valves may be open at once: the manual button opens both so a
  # downstream mechanical valve selects the source. The mutual-exclusion
  # interlock is therefore removed; the irrigation_sequence still opens only
  # one valve at a time on its own.
  - platform: gpio
    name: "Fertigation Valve"
    id: fertigation_valve
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - script.execute: stop_pump_without_path
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 6
      mode: OUTPUT
      inverted: true
  - platform: gpio
    name: "Clean Water Valve"
    id: clean_water_valve
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - script.execute: stop_pump_without_path
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 5
      mode: OUTPUT
      inverted: true
  - platform: gpio
    name: "Relay 4"
    id: relay_4
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 3
      mode: OUTPUT
      inverted: true
  - platform: gpio
    name: "Relay 5"
    id: relay_5
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 4
      mode: OUTPUT
      inverted: true
  - platform: gpio
    name: "Relay 1"
    id: relay_1
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 0
      mode: OUTPUT
      inverted: true
  - platform: gpio
    name: "Relay 2"
    id: relay_2
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 1
      mode: OUTPUT
      inverted: true
  - platform: gpio
    name: "Relay 3"
    id: relay_3
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 2
      mode: OUTPUT
      inverted: true

# Cycle settings, adjustable at runtime from the web UI, HA, or MQTT.
select:
  - platform: template
    name: "Cycle Mode"
    id: cycle_mode
    options:
      - Time
      - Volume
    initial_option: Time
    optimistic: true
    restore_value: true

number:
  - platform: template
    name: "Cycle Minutes"
    id: cycle_minutes
    min_value: 0
    max_value: 180
    step: 1
    initial_value: 25
    optimistic: true
    restore_value: true
    unit_of_measurement: min
    mode: box
  - platform: template
    name: "Cycle Liters"
    id: cycle_liters
    min_value: 0
    max_value: 500
    step: 0.5
    initial_value: 100
    optimistic: true
    restore_value: true
    unit_of_measurement: L
    mode: box
  - platform: template
    name: "Pre-wet Percent"
    id: prewet_percent
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 20
    optimistic: true
    restore_value: true
    unit_of_measurement: "%"
    mode: slider
  - platform: template
    name: "Min Flow"
    id: min_flow_lpm
    min_value: 0
    max_value: 10
    step: 0.1
    initial_value: 0.5
    optimistic: true
    restore_value: true
    unit_of_measurement: "L/min"
    mode: box
  # Minimum 1: the flush is what guarantees no residues, so it cannot
  # be zeroed.
  - platform: template
    name: "Flush Minutes"
    id: flush_minutes
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true
    unit_of_measurement: min
    mode: box
  # Flow-sensor calibration factor (pulses per litre). The YF-B5's nominal
  # K-factor is 396; this unit measured 387.0 (see docs/flow-sensor.md).
  # Adjust it against a measured volume without reflashing. Applied to both the
  # live rate and the total since reset.
  - platform: template
    name: "Pulses Per Liter"
    id: pulses_per_liter
    min_value: 100
    max_value: 2000
    step: 0.1
    initial_value: 387.0
    optimistic: true
    restore_value: true
    unit_of_measurement: "pulses/L"
    mode: box

globals:
  # Persisted cumulative water since the last reset, in liters. Survives normal reboots.
  - id: water_total_l
    type: double
    restore_value: yes
    initial_value: "0"
  # millis() at the last pump turn-on; drives the 15 s priming grace.
  - id: pump_on_since_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  # Consecutive seconds of low flow while armed; the 3 s confirm window.
  - id: low_flow_secs
    type: int
    restore_value: no
    initial_value: "0"
  # Last observed cumulative pulse count, to compute per-cycle deltas.
  - id: last_total_pulses
    type: double
    restore_value: no
    initial_value: "0"
  # Carries the explicit preference-sync result between reset actions.
  - id: reset_persistence_ok
    type: bool
    restore_value: no
    initial_value: "false"
  # Which phase the sequence is in: 0 idle, 1 pre-wet, 2 fertigation, 3 flush.
  # Drives the phase-aware watchdog escape.
  - id: current_phase
    type: int
    restore_value: no
    initial_value: "0"
  # water_total_l snapshot at the start of a volume phase, so the phase can
  # measure its own delta against the persisted cumulative counter.
  - id: phase_start_l
    type: double
    restore_value: no
    initial_value: "0"

script:
  # The pump must never run without an open path, so closing the last valve
  # stops it — whichever caller closed it: dashboard, sequence, or the manual
  # button. Guarded on the pump already running so the sequence's own valve
  # closes (pump already off) don't republish OFF each time.
  - id: stop_pump_without_path
    then:
      - if:
          condition:
            - switch.is_on: pump
            - switch.is_off: clean_water_valve
            - switch.is_off: fertigation_valve
          then:
            - switch.turn_off: pump

  # The pump pauses across each valve handover — stop, swap the valve, start
  # again — so it never runs against closed valves, with its 3.8 bar pressure
  # switch as the backstop rather than the plan. Each valve is turned off
  # explicitly before the next is turned on, so the sequence opens only one at
  # a time on its own even though the interlock no longer enforces it.
  - id: irrigation_sequence
    mode: single
    then:
      # Phase 1: pre-wet with clean water — prime lines, moisten soil.
      - if:
          condition:
            lambda: 'return (id(cycle_mode).state == "Time" ? id(cycle_minutes).state : id(cycle_liters).state) * id(prewet_percent).state / 100.0 > 0;'
          then:
            - lambda: 'id(current_phase) = 1;'
            - if:
                condition:
                  lambda: 'return id(cycle_mode).state == "Volume";'
                then:
                  - lambda: 'id(phase_start_l) = id(water_total_l);'
            - switch.turn_on: clean_water_valve
            - delay: 2s
            - switch.turn_on: pump
            - if:
                condition:
                  lambda: 'return id(cycle_mode).state == "Time";'
                then:
                  - delay: !lambda 'return (uint32_t)(id(cycle_minutes).state * id(prewet_percent).state / 100.0 * 60000);'
                else:
                  - wait_until:
                      lambda: 'return id(water_total_l) - id(phase_start_l) >= id(cycle_liters).state * id(prewet_percent).state / 100.0;'
      # Phase 2: fertigation.
      - if:
          condition:
            lambda: 'return (id(cycle_mode).state == "Time" ? id(cycle_minutes).state : id(cycle_liters).state) * (1.0 - id(prewet_percent).state / 100.0) > 0;'
          then:
            - lambda: 'id(current_phase) = 2;'
            - switch.turn_off: pump
            - delay: 2s
            - switch.turn_off: clean_water_valve
            - switch.turn_on: fertigation_valve
            - delay: 2s
            - if:
                condition:
                  lambda: 'return id(cycle_mode).state == "Volume";'
                then:
                  - lambda: 'id(phase_start_l) = id(water_total_l);'
            - switch.turn_on: pump
            - if:
                condition:
                  lambda: 'return id(cycle_mode).state == "Time";'
                then:
                  - delay: !lambda 'return (uint32_t)(id(cycle_minutes).state * (1.0 - id(prewet_percent).state / 100.0) * 60000);'
                else:
                  - wait_until:
                      lambda: 'return id(water_total_l) - id(phase_start_l) >= id(cycle_liters).state * (1.0 - id(prewet_percent).state / 100.0);'
      # Phase 3: flush with clean water so no residues remain.
      - lambda: 'id(current_phase) = 3;'
      - switch.turn_off: pump
      - delay: 2s
      - switch.turn_off: fertigation_valve
      - switch.turn_on: clean_water_valve
      - delay: 2s
      - switch.turn_on: pump
      - delay: !lambda "return (uint32_t)(id(flush_minutes).state * 60000);"
      # Shutdown
      - switch.turn_off: pump
      - lambda: 'id(current_phase) = 0;'
      - delay: 2s
      - switch.turn_off: clean_water_valve

  # Watchdog recovery for an empty fertigation tank. This deliberately does
  # not use abort_irrigation: it preserves the required full safety flush.
  - id: recovery_flush
    mode: single
    then:
      - script.stop: irrigation_sequence
      - switch.turn_off: pump
      - delay: 2s
      - switch.turn_off: fertigation_valve
      - switch.turn_on: clean_water_valve
      - delay: 2s
      - lambda: 'id(current_phase) = 3;'
      - switch.turn_on: pump
      - delay: !lambda "return (uint32_t)(id(flush_minutes).state * 60000);"
      - switch.turn_off: pump
      - lambda: 'id(current_phase) = 0;'
      - delay: 2s
      - switch.turn_off: clean_water_valve

  # Single shared interrupt path: the stop button, the MQTT stop topic,
  # and any future sensor (tank float switch, pump current) all execute
  # this. Pump goes off first so it never runs against closed valves.
  - id: abort_irrigation
    mode: single
    then:
      - script.stop: irrigation_sequence
      - script.stop: recovery_flush
      - lambda: 'id(current_phase) = 0;'
      - switch.turn_off: pump
      - delay: 2s
      - switch.turn_off: fertigation_valve
      - switch.turn_off: clean_water_valve

  # Manual start/stop from the onboard button, no wifi needed. Opens both
  # valves so the downstream mechanical valve selects the source, then runs
  # the pump; pressing again stops the pump first, then closes both valves.
  - id: manual_pump_toggle
    mode: single
    then:
      - if:
          condition:
            - switch.is_on: pump
          then:
            - switch.turn_off: pump
            - delay: 2s
            - switch.turn_off: clean_water_valve
            - switch.turn_off: fertigation_valve
          else:
            - switch.turn_on: clean_water_valve
            - switch.turn_on: fertigation_valve
            - delay: 2s
            - switch.turn_on: pump

  - id: dry_run_publish
    then:
      - mqtt.publish:
          topic: kc868-a8/flow/dry_run
          payload: "ON"

  - id: recovery_flush_publish
    then:
      - mqtt.publish:
          topic: kc868-a8/irrigation/recovery_flush
          payload: "ON"

  # Shared native-web/MQTT reset path. The short delay after assignment gives
  # the restoring global's component loop time to stage zero before sync.
  - id: reset_total_water
    mode: single
    then:
      - if:
          condition:
            - switch.is_on: pump
          then:
            - lambda: 'ESP_LOGW("flow", "total-water reset rejected: pump running");'
            - mqtt.publish:
                topic: kc868-a8/flow/reset_total/result
                payload: rejected_pump_running
                retain: false
          else:
            - if:
                condition:
                  lambda: 'return isnan(id(flow_pulses).state);'
                then:
                  - lambda: 'ESP_LOGW("flow", "total-water reset rejected: flow unknown");'
                  - mqtt.publish:
                      topic: kc868-a8/flow/reset_total/result
                      payload: rejected_flow_unknown
                      retain: false
                else:
                  - if:
                      condition:
                        lambda: 'return id(flow_pulses).state >= 0.1f;'
                      then:
                        - lambda: 'ESP_LOGW("flow", "total-water reset rejected: flow active");'
                        - mqtt.publish:
                            topic: kc868-a8/flow/reset_total/result
                            payload: rejected_flow_active
                            retain: false
                      else:
                        - if:
                            condition:
                              lambda: 'return fabs(id(water_total_l)) < 0.000001;'
                            then:
                              - lambda: 'ESP_LOGI("flow", "total-water reset skipped: already zero");'
                              - mqtt.publish:
                                  topic: kc868-a8/flow/reset_total/result
                                  payload: already_zero
                                  retain: false
                            else:
                              - lambda: 'id(water_total_l) = 0.0;'
                              - delay: 1s
                              - lambda: |-
                                  id(reset_persistence_ok) = global_preferences->sync();
                                  if (id(reset_persistence_ok)) {
                                    id(total_water).publish_state(0.0);
                                    ESP_LOGI("flow", "total-water reset persisted successfully");
                                  } else {
                                    // RAM is zero, but it may not survive reboot after this error.
                                    id(total_water).publish_state(id(water_total_l));
                                    ESP_LOGE("flow", "total-water reset persistence failed");
                                  }
                              - if:
                                  condition:
                                    lambda: 'return id(reset_persistence_ok);'
                                  then:
                                    - mqtt.publish:
                                        topic: kc868-a8/flow/reset_total/result
                                        payload: success
                                        retain: false
                                  else:
                                    - mqtt.publish:
                                        topic: kc868-a8/flow/reset_total/result
                                        payload: error_persistence
                                        retain: false

button:
  - platform: template
    name: "Start Irrigation"
    id: start_irrigation
    on_press:
      - script.execute: irrigation_sequence
  - platform: template
    name: "Stop Irrigation"
    id: stop_irrigation
    on_press:
      - script.execute: abort_irrigation
  - platform: template
    name: "Reset Total Water"
    id: reset_total_water_button
    on_press:
      - script.execute: reset_total_water

binary_sensor:
  - platform: template
    name: "Irrigation Running"
    lambda: "return id(irrigation_sequence).is_running() || id(recovery_flush).is_running();"
  # Mirrors the SmartShunt's own charged detection (charged voltage
  # 14.0V, tail current 4% of 8Ah, 3 min): ON when the charge cycle
  # completes, OFF again once the MPPT drops to float.
  - platform: template
    name: "Battery Charged"
    id: battery_charged
    filters:
      - delayed_on: 180s
    lambda: |-
      if (isnan(id(batt_voltage).state) || isnan(id(batt_current).state))
        return {};
      return id(batt_voltage).state >= 14.0 &&
             fabs(id(batt_current).state) <= 0.32;
    on_press:
      - mqtt.publish:
          topic: kc868-a8/battery/charged
          payload: "ON"
  - platform: gpio
    name: "a8-input1"
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 0
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "a8-input2"
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 1
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "a8-input3"
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 2
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "a8-input4"
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 3
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "a8-input5"
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 4
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "a8-input6"
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 5
      mode: INPUT
      inverted: true
  - platform: gpio
    name: "a8-input7"
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 6
      mode: INPUT
      inverted: true
  - platform: gpio
  # External button wired to input terminal D8 (opto-isolated dry contact):
  # manual irrigation start/stop at the board, independent of wifi/MQTT. Opens
  # both valves and starts the pump; pressing again stops the pump and closes
  # both valves.
    name: "Pump Button"
    id: pump_button
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 7
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: 50ms
    on_press:
      - script.execute: manual_pump_toggle
  - platform: gpio
    name: "a8-s3"
    pin:
      number: 32
      inverted: true
  - platform: gpio
    name: "a8-s4"
    pin:
      number: 33
      inverted: true

sensor:
  # The shunt broadcasts ~1/s; throttle publishing to every 5s.
  - platform: victron_ble
    victron_ble_id: smartshunt
    name: "Battery Voltage"
    id: batt_voltage
    type: BATTERY_VOLTAGE
    filters:
      - throttle_average: 5s
  - platform: victron_ble
    victron_ble_id: smartshunt
    name: "Battery Current"
    id: batt_current
    type: BATTERY_CURRENT
    filters:
      - throttle_average: 5s
  - platform: victron_ble
    victron_ble_id: smartshunt
    name: "Battery State of Charge"
    type: STATE_OF_CHARGE
    filters:
      - throttle: 5s
  - platform: victron_ble
    victron_ble_id: smartshunt
    name: "Battery Consumed Ah"
    type: CONSUMED_AH
    filters:
      - throttle: 5s
  - platform: victron_ble
    victron_ble_id: smartshunt
    name: "Battery Time Remaining"
    type: TIME_TO_GO
    filters:
      - throttle: 5s
  # Part of the reboot diagnosis: uptime resetting proves a reboot.
  - platform: uptime
    name: "Uptime"
    update_interval: 30s
  # YF-B5 flow sensor on GPIO14 (sensor header S1). 387.0 pulses per liter measured
  # (396 pulses per liter nominal).
  # Powered at 12V but its output is a stiff ~5V logic signal, dropped to ~3V
  # by a 2.2k series / 3.3k-to-GND divider; the sensor drives its own output,
  # so no internal pullup.
  - platform: pulse_counter
    pin:
      number: GPIO14
      mode:
        input: true
    id: flow_pulses
    name: "Flow Rate"
    unit_of_measurement: "L/min"
    accuracy_decimals: 2
    update_interval: 1s
    # pulse_counter reports pulses/min; 387.0 pulses = 1 L measured (396 nominal).
    filters:
      - lambda: |-
          float k = id(pulses_per_liter).state;
          return x / (k > 0 ? k : 387.0);
    total:
      id: flow_total_pulses
      internal: true
      # Accumulate the delta since the last update into the persisted total.
      on_value:
        - lambda: |-
            double delta = x - id(last_total_pulses);
            if (delta < 0) delta = x;      // counter reset (reboot) → treat x as delta
            id(last_total_pulses) = x;
            float k = id(pulses_per_liter).state;
            id(water_total_l) += delta / (k > 0 ? k : 387.0);

  # Persisted cumulative water since the last reset, exposed as its own sensor.
  - platform: template
    name: "Total Water"
    id: total_water
    unit_of_measurement: "L"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: return id(water_total_l);

interval:
  # Dry-run protection: with the pump running past its priming grace, sustained
  # low flow invokes a fertigation recovery flush or the shared abort path.
  - interval: 1s
    then:
      - lambda: |-
          if (!id(pump).state) { id(low_flow_secs) = 0; return; }
          if (millis() - id(pump_on_since_ms) < 15000) { id(low_flow_secs) = 0; return; }
          if (isnan(id(flow_pulses).state)) return;
          if (id(flow_pulses).state < id(min_flow_lpm).state) {
            id(low_flow_secs)++;
          } else {
            id(low_flow_secs) = 0;
          }
          if (id(low_flow_secs) >= 3) {
            id(low_flow_secs) = 0;
            if (id(current_phase) == 2) {
              id(recovery_flush)->execute();
              ESP_LOGW("flow", "dry-run detected during fertigation; recovery flush starting");
              id(recovery_flush_publish)->execute();
            } else {
              id(abort_irrigation)->execute();
              ESP_LOGW("flow", "dry-run detected: no flow with pump on, aborting");
            }
            id(dry_run_publish)->execute();
          }

logger:

# Diagnosing the reboot-on-relay-switch issue: reset_reason distinguishes
# a brownout (power path) from a firmware panic. Remove once resolved.
debug:
  update_interval: 30s

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"

# No API client ever connects (control is MQTT + web dashboard), so the
# API's own no-client watchdog must be off — its default reboots the
# device every 15 minutes. Same reason mqtt has reboot_timeout: 0s.
api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    id: my_ota
    password: !secret ota_password

mqtt:
  broker: !secret mqtt_broker_ip
  username: !secret mqtt_broker_username
  password: !secret mqtt_broker_password
  client_id: kc868-a8
  reboot_timeout: 0s
  on_message:
    - topic: kc868-a8/irrigation/start
      then:
        - script.execute: irrigation_sequence
    - topic: kc868-a8/irrigation/stop
