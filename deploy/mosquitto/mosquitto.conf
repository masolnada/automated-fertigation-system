# Dedicated fertigation broker. The KC868-A8 controller reaches this on the VM
# host (10.0.20.150:1883, VLAN 20); hort-server reaches it in-compose as
# mosquitto:1883. No websockets listener: the browser never speaks MQTT
# (hort-server is the only client).
listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/passwd

persistence true
persistence_location /mosquitto/data/
